py", "line": 73, "line_end": 113, "source_expr": "f\"\"\"\\\nYou are an independent referee applying the SCIENTIFIC-METHOD CHARTER to ONE\nproposed hypothesis-verdict change. Judge ONLY whether the verdict's SUBSTANCE\nobeys the charter — not its wording, not the deliverable, not anything else.\n\n<charter>\n{FALSIFICATION_CHARTER}\n</charter>\n\nTHE HYPOTHESIS\n  statement: {statement}\n  registered prediction: {prediction}\n  falsification criterion: {criterion}\n\nTHE PROPOSED VERDICT\n  status -> {status}\n  rationale (comment): {comment}\n  cited evidence: {evidence!r}\n\nTHE CITED DELEGATION'S RESULT (the work the verdict rests on)\n{report}\n{prior_block}\nCheck three things, each by clause number:\n  1. §2 ATTEMPT ADEQUACY — did the cited work SEVERELY test the REGISTERED\n     prediction (could it have refuted the claim had it been false), or is it a\n     token / off-target probe?\n  2. §3 VERDICT FOLLOWS — does {status} follow from the cited result?\n     (adequate & contradicted -> FALSIFIED; adequate & survived -> SUPPORTED;\n      inadequate or confounded -> INCONCLUSIVE.)\n  3. §4 NO GOALPOST MOVE — if FALSIFIED, does it rest on the SAME registered\n     prediction, not a post-hoc observation?\n\nReply in EXACTLY this format and nothing else:\nSUBSTANCE: OK\n— or —\nSUBSTANCE: FLAG\nCRITIQUE: <one or two sentences naming the clause and the concrete problem>\n\nOK = all three checks pass. FLAG = at least one fails; the CRITIQUE must name the\nclause and the specific problem. When genuinely unsure, prefer OK — this is\nadvisory and the strategizer stays in control.\"\"\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~epistemics~verdict_validator.py:73-113", "file": "src/adda/_src/epistemics/verdict_validator.py", "line": 73, "line_end": 113}}], "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~epistemics~verdict_validator.py:43-54", "file": "src/adda/_src/epistemics/verdict_validator.py", "line": 43, "line_end": 54}}, {"id": "reviewer", "title": "Problem-statement review", "kind": "advisory", "phase": "pre-run", "module": "epistemics/reviewer.py", "symbol": "review_gaps", "effect": "Always writes a report; never blocks a run.", "file": "src/adda/_src/epistemics/reviewer.py", "line": 131, "doc": "The elements flagged as gaps (status == 'gap').", "signature": "review_gaps", "match": "symbol", "span": false, "doc_line": 132, "doc_line_end": 132, "done_order": null, "messages": [], "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~epistemics~reviewer.py:132-132", "file": "src/adda/_src/epistemics/reviewer.py", "line": 132, "line_end": 132}}, {"id": "report_shape", "title": "Report shape retry", "kind": "soft", "phase": "worker return", "module": "nodes/parsing.py", "symbol": "_classify_response", "effect": "A malformed worker report is diagnosed and retried.", "file": "src/adda/_src/nodes/parsing.py", "line": 173, "doc": "Return a REFLECT diagnosis string if text is malformed, else None.\n\nParameters\n----------\ntext : str\n    The raw response text from a worker agent.\nrequired_sections : list[str] or None\n    Subsection headers that must appear in the ``## Report`` block.\n    When ``None`` the four default sections from\n    ``_REQUIRED_SUBSECTIONS`` are used.", "signature": "_classify_response", "match": "symbol", "span": false, "doc_line": 177, "doc_line_end": 187, "done_order": null, "messages": [{"text": "<REFLECT_DIAGNOSIS_SHORT>", "file": "src/adda/_src/nodes/parsing.py", "line": 198, "line_end": 198, "source_expr": "REFLECT_DIAGNOSIS_SHORT", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~parsing.py:198-198", "file": "src/adda/_src/nodes/parsing.py", "line": 198, "line_end": 198}}, {"text": "<REFLECT_DIAGNOSIS_CAPABILITY_LIMIT>", "file": "src/adda/_src/nodes/parsing.py", "line": 206, "line_end": 206, "source_expr": "REFLECT_DIAGNOSIS_CAPABILITY_LIMIT", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~parsing.py:206-206", "file": "src/adda/_src/nodes/parsing.py", "line": 206, "line_end": 206}}, {"text": "<REFLECT_DIAGNOSIS_NO_REPORT_HEADING>", "file": "src/adda/_src/nodes/parsing.py", "line": 207, "line_end": 207, "source_expr": "REFLECT_DIAGNOSIS_NO_REPORT_HEADING", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~parsing.py:207-207", "file": "src/adda/_src/nodes/parsing.py", "line": 207, "line_end": 207}}, {"text": "<REFLECT_DIAGNOSIS_MISSING_SUBSECTIONS_TEMPLATE.format(missing_subsections=', '.join((f\"'{s}'\" for s in missing)))>", "file": "src/adda/_src/nodes/parsing.py", "line": 210, "line_end": 212, "source_expr": "REFLECT_DIAGNOSIS_MISSING_SUBSECTIONS_TEMPLATE.format(\n            missing_subsections=\", \".join(f\"'{s}'\" for s in missing)\n        )", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~parsing.py:210-212", "file": "src/adda/_src/nodes/parsing.py", "line": 210, "line_end": 212}}], "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~parsing.py:177-187", "file": "src/adda/_src/nodes/parsing.py", "line": 177, "line_end": 187}}, {"id": "reproduction", "title": "Reproduction gate", "kind": "hard", "phase": "Done() + CheckDeliverable()", "module": "nodes/reproduction_gate.py", "symbol": "ReproductionGateMixin._reproduction_gate", "effect": "pipeline.ipynb must execute cleanly, add zero oracle rows and rewrite none.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 92, "doc": "Execute pipeline.ipynb under a CONTROLLED reproduction gate.\n\nThe binding reproducibility check. The pipeline must:\n  (a) finish cleanly within a time ceiling (no heavy from-scratch run);\n  (b) add ZERO new oracle rows (lazy: skip FINISHED evals);\n  (c) NOT modify/delete existing ledger rows (integrity — no faking the\n      zero-delta by delete+re-add or value rewrite);\n  (d) print ``REPRODUCED: <value>`` — an informational headline marker\n      for the critic/human; the runtime does NOT gate on it. Headline\n      grounding (the value traces to a real ledger row) is the critic's\n      HEADLINE PROVENANCE check, not an independent runtime extremum\n      match (which wrongly rejected constrained optima).\nReturns None on PASS (and stashes ``self._repro_ok_detail``), else a\nproblem string. Skips silently when there is no run context. Callable\nwithout ``state`` — study dir comes from ``self._study_dir``.\n\nOn PASS the deliverable is a faithful, lightweight, lazy reproduction —\nnot a script doing \"sneaky stuff\" unrelated to validating the pipeline.", "signature": "ReproductionGateMixin._reproduction_gate", "match": "symbol", "span": false, "doc_line": 93, "doc_line_end": 111, "done_order": null, "messages": [{"text": "Canonical store has no rows — the campaign has not been evaluated yet. Run the delegation pipeline first so the ledger is populated, then the notebook can be reproduced lazily against those rows.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 198, "line_end": 201, "source_expr": "\"Canonical store has no rows — the campaign has not been \"\n                \"evaluated yet. Run the delegation pipeline first so the \"\n                \"ledger is populated, then the notebook can be reproduced \"\n                \"lazily against those rows.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~reproduction_gate.py:198-201", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 198, "line_end": 201}}, {"text": "{deliverable.name} did not finish within {_timeout}s. A reproduction must be lightweight — load the ledger and skip finished evals and heavy refits (cache-or-load surrogates). Make it lazy.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 236, "line_end": 239, "source_expr": "f\"{deliverable.name} did not finish within {_timeout:.0f}s. A \"\n                    \"reproduction must be lightweight — load the ledger and skip \"\n                    \"finished evals and heavy refits (cache-or-load surrogates). \"\n                    \"Make it lazy.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~reproduction_gate.py:236-239", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 236, "line_end": 239}}, {"text": "{deliverable.name} is NOT lazy: re-running it changed the ledger row count ({before_n} → {after_n}). It must LOAD the ledger (ExperimentData.from_file) and reach the oracle only via get_evaluator() so FINISHED rows are skipped — zero new evals.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 255, "line_end": 258, "source_expr": "f\"{deliverable.name} is NOT lazy: re-running it changed the ledger row \"\n                f\"count ({before_n} → {after_n}). It must LOAD the ledger \"\n                \"(ExperimentData.from_file) and reach the oracle only via \"\n                \"get_evaluator() so FINISHED rows are skipped — zero new evals.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~reproduction_gate.py:255-258", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 255, "line_end": 258}}, {"text": "{deliverable.name} MODIFIED existing ledger rows. A reproduction must read the ledger READ-ONLY (it may re-store identical rows, but must not rewrite values or delete+re-add). Do not tamper with the canonical store.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 262, "line_end": 265, "source_expr": "f\"{deliverable.name} MODIFIED existing ledger rows. A reproduction must \"\n                \"read the ledger READ-ONLY (it may re-store identical rows, but \"\n                \"must not rewrite values or delete+re-add). Do not tamper with \"\n                \"the canonical store.\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~reproduction_gate.py:262-265", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 262, "line_end": 265}}], "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~reproduction_gate.py:93-111", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 93, "line_end": 111}}, {"id": "deliverables", "title": "Required deliverables present", "kind": "hard", "phase": "Done() + CheckDeliverable()", "module": "nodes/reproduction_gate.py", "symbol": "ReproductionGateMixin._missing_deliverables", "effect": "Names any required deliverable that is absent.", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 54, "doc": "Return required deliverable paths not present at study_dir yet.\n\nThe single deliverable (pipeline.ipynb) is required, authored before\nDone() is accepted, UNLESS the study turns off pipeline_deliverable —\nit is the human-readable recipe AND the reproduction in one notebook:\nthe runtime executes it lazily (see _reproduction_gate) to verify the\nheadline re-derives from the ledger with zero new evals, which makes\nno sense for a study with no ledger at all. Requiring it unconditionally\n(BACKLOG #30) meant a pure-derivation study's strategizer could never\nsatisfy Done() regardless of what its own tools/prompt said — this was\nthe third of three places that assumption was baked in (the other two,\nthe injected notebook_deliverable_spec() preamble and the notebook-\nauthoring tools themselves, are already gated the same way). Additional\npaths can still be declared in state['required_deliverables']\nregardless of this flag.", "signature": "ReproductionGateMixin._missing_deliverables", "match": "symbol", "span": false, "doc_line": 55, "doc_line_end": 70, "done_order": null, "messages": [], "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~reproduction_gate.py:55-70", "file": "src/adda/_src/nodes/reproduction_gate.py", "line": 55, "line_end": 70}}, {"id": "supported", "title": "SUPPORTED needs an attempt", "kind": "hard", "phase": "HypothesisUpdate()", "module": "nodes/tools/routing/ledger.py", "symbol": "LedgerTools._supported_needs_attempt", "effect": "Refused synchronously at the data boundary.", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 127, "doc": "SUPPORTED without a completed falsification attempt: a TWO-SHOT CONFIRM.\n\nNot a hard block (§4, user-approved). A verdict is reversible when\njustified in writing, so this is a deliberate pause — not an impossible\naction. First call nudges; a re-call with a written justification in\n`comment` confirms. The verdict validator and the gate critic remain\nthe downstream falsification floor.", "signature": "LedgerTools._supported_needs_attempt", "match": "symbol", "span": false, "doc_line": 130, "doc_line_end": 137, "done_order": null, "messages": [{"text": "[CONFIRM] You are marking {hypothesis_id} SUPPORTED without a completed falsification attempt on record. The Popperian charter asks that a hypothesis be challenged before it is accepted — the clean path is to delegate a refutation test (is_falsification_attempt=True, hypothesis_ids=['{hypothesis_id}']), or LinkFalsificationAttempt if one already ran. If you have genuine grounds to accept it WITHOUT that, re-call HypothesisUpdate with the same status and a written justification in `comment` (a sentence on why SUPPORTED holds and how it could still be refuted) — that confirms. Falsification criterion: {crit}", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 158, "line_end": 170, "source_expr": "f\"[CONFIRM] You are marking {hypothesis_id} SUPPORTED \"\n                \"without a completed falsification attempt on record. \"\n                \"The Popperian charter asks that a hypothesis be \"\n                \"challenged before it is accepted — the clean path is \"\n                \"to delegate a refutation test \"\n                \"(is_falsification_attempt=True, \"\n                f\"hypothesis_ids=['{hypothesis_id}']), or \"\n                \"LinkFalsificationAttempt if one already ran. If you \"\n                \"have genuine grounds to accept it WITHOUT that, re-call \"\n                \"HypothesisUpdate with the same status and a written \"\n                \"justification in `comment` (a sentence on why SUPPORTED \"\n                \"holds and how it could still be refuted) — that \"\n                f\"confirms. Falsification criterion: {crit!r}\"", "edit": {"ok": true, "mode": "message", "key": "src~adda~_src~nodes~tools~routing~ledger.py:158-170", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 158, "line_end": 170}}], "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~ledger.py:130-137", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 130, "line_end": 137}}, {"id": "unledgered", "title": "Unledgered evaluations", "kind": "soft", "phase": "continuous", "module": "epistemics/science_monitor.py", "symbol": "ScienceMonitor._check_unledgered", "effect": "Injected as an in-band notice; never blocks.", "file": "src/adda/_src/epistemics/science_monitor.py", "line": 199, "doc": "UNLEDGERED_EVALS: DONE delegations that reported evals but wrote no\nrows to ANY experiment store. No-ops when store_dir is None.\n\nCounts a delegation's stamped rows by provenance across every experiment\nstore (not just the default one) — so a worker that reached the oracle\nvia get_evaluator(namespace=...) at the call site is NOT false-flagged as\nhaving bypassed it (run 20260627T203327 D003 wrote to the 'polar' store\nand was wrongly warned by the old canonical-only check).", "signature": "ScienceMonitor._check_unledgered", "match": "symbol", "span": false, "doc_line": 200, "doc_line_end": 208, "done_order": null, "messages": [], "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~epistemics~science_monitor.py:200-208", "file": "src/adda/_src/epistemics/science_monitor.py", "line": 200, "line_end": 208}}, {"id": "unstamped", "title": "Unstamped rows", "kind": "soft", "phase": "continuous", "module": "epistemics/science_monitor.py", "symbol": "ScienceMonitor._check_unstamped_rows", "effect": "Injected as an in-band notice; never blocks.", "file": "src/adda/_src/epistemics/science_monitor.py", "line": 103, "doc": "UNSTAMPED_ROWS: the experiment stores gained rows that carry no\nprovenance stamp — appended outside get_evaluator() (the public\nExperimentData.store() write-door). Principle: a counted eval must be\nattributable to a source; a stamp-less append is neither counted nor\nreproducible, so surface it instead of letting it pass silently. This is\nthe reverse direction of UNLEDGERED_EVALS (which asks 'did a delegation's\nevals reach the store?'); this asks 'do all the store's rows have an\nowner?'. Warn-only — it never blocks a run. No-ops when store_dir is None.", "signature": "ScienceMonitor._check_unstamped_rows", "match": "symbol", "span": false, "doc_line": 104, "doc_line_end": 112, "done_order": null, "messages": [], "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~epistemics~science_monitor.py:104-112", "file": "src/adda/_src/epistemics/science_monitor.py", "line": 104, "line_end": 112}}, {"id": "verdict_advisory", "title": "Verdict advisory note", "kind": "soft", "phase": "HypothesisUpdate()", "module": "nodes/tools/routing/ledger.py", "symbol": "LedgerTools._verdict_advisory", "switch": "F3DASM_VERDICT_VALIDATOR", "effect": "The referee's ruling is returned as advice attached to the update.", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 248, "doc": "Advisory live verdict-substance check (#9), as a suffix or \"\".\n\nClosing verdicts only, and only when a NEW entry was actually appended\n(\"Updated …\") — not on ERROR/SETTLED no-ops. Non-blocking: it appends a\ncharter critique to what the agent sees this turn, but never changes\nthe update.", "signature": "LedgerTools._verdict_advisory", "match": "symbol", "span": false, "doc_line": 256, "doc_line_end": 262, "done_order": null, "messages": [], "edit": {"ok": true, "mode": "docstring", "key": "src~adda~_src~nodes~tools~routing~ledger.py:256-262", "file": "src/adda/_src/nodes/tools/routing/ledger.py", "line": 256, "line_end": 262}}], "shared": [{"name": "FALSIFICATION_CHARTER", "file": "src/adda/_src/knowledge/charter.py", "line": 42, "chars": 4406, "text": "SCIENTIFIC-METHOD CHARTER — the shared, binding contract for testing and\nlabelling hypotheses. It is identical in the strategizer's and the critic's\ninstructions: cite a clause by number (\"Charter §3\") and the other party\ndefers to it.\n\n§1  A hypothesis is ONE falsifiable claim carrying a registered prediction —\n    the observable whose occurrence would refute the claim.\n\n§2  ATTEMPT and VERDICT are distinct. Before a hypothesis may be closed, an\n    adequate falsification ATTEMPT must have been made — a SEVERE test: one that\n    genuinely probes the registered prediction and could have refuted the claim\n    had it been false (a token probe is not adequate). Adequacy is a property of\n    the test's SEVERITY, never of a label: tag such a delegation\n    is_falsification_attempt so the attempt is auditable, but the tag only\n    RECORDS the attempt — it cannot make a weak test adequate, nor a severe\n    untagged one inadequate. The VERDICT is a separate judgement that follows\n    the test's OUTCOME — never the mere fact that an attempt was run.\n    For a prediction whose refutation turns on FINDING an instance — an\n    achievement or existence claim (\"some design in this space reaches X\"), or\n    its negation (\"no design reaches X\") — severity means the search had the\n    POWER to find that instance had it existed; concretely, that had a\n    qualifying instance existed in the space the claim ranges over, the search\n    would very probably have found it. That is the whole test. HOW you argue the\n    search had that power is open and judged on its merits — adequate coverage\n    of the space (dense/near-exhaustive sampling, credible in low dimension), a\n    guiding surrogate that predicts the claim's OWN observable above chance\n    (needed as dimension grows, where coverage alone cannot suffice), a\n    theoretical bound, or a combination. These are examples, not a checklist:\n    no single one is mandatory, and a surrogate for a DIFFERENT quantity never\n    counts (it does not measure the claim). A search that merely stopped\n    improving, or whose only power-argument the work itself undercuts (e.g. a\n    surrogate it reports as near-chance with no coverage argument to stand on),\n    is an INADEQUATE test of such a claim and routes to INCONCLUSIVE under §3 —\n    failing to find a better instance is not\n    the same as showing none exists.\n\n§3  A hypothesis is FALSIFIED if and only if an ADEQUATE test (§2) of its\n    registered prediction yields a contradiction. Concretely:\n      - adequate test, prediction contradicted     -> FALSIFIED (you may not\n        decline the verdict to protect a favoured claim);\n      - adequate test, prediction NOT contradicted -> the hypothesis SURVIVED\n        and is therefore SUPPORTED (§5) — corroborated, not proven; it is NOT\n        falsified, even if other evidence makes it look wrong;\n      - inadequate or confounded test              -> INCONCLUSIVE. A\n        contradiction from a flawed test indicts the test, not the hypothesis\n        (Duhem–Quine).\n    INCONCLUSIVE is reserved for an inadequate test; a hypothesis that has had\n    no adequate test yet is simply OPEN.\n\n§4  No moving the goalposts. A FALSIFIED verdict must rest on the contradiction\n    of the SAME prediction that was registered — not a different, post-hoc\n    observation chosen after seeing the data (the Texas-sharpshooter fallacy).\n    If the registered prediction was the wrong test, revise it explicitly and\n    run a new adequate test; do not reinterpret the old result.\n\n§5  SUPPORTED is corroboration, not proof. It means the hypothesis survived at\n    least one adequate attempt to refute it (§2–§3). You never \"confirm\" a\n    hypothesis; you only fail to falsify it.\n\n§6  The four statuses are the only ones: OPEN, SUPPORTED, FALSIFIED,\n    INCONCLUSIVE. OPEN = no adequate test yet; the other three are closing\n    statuses and must cite a real delegation ID plus a CONCRETE result from\n    that delegation that bears on the registered prediction — a measurement, a\n    category, a pass/fail, or a comparison (whatever form the prediction takes;\n    not all evidence is numeric — a qualitative observation that contradicts a\n    risky prediction falsifies it just as a black swan refutes \"all swans are\n    white\"). What is forbidden is closing on prose or vibes: the cited result\n    must be specific and checkable against the prediction.\n"}, {"name": "F3DASM_CORE_IDIOMS", "file": "src/adda/_src/knowledge/idioms.py", "line": 17, "chars": 4778, "text": "VERIFIED f3dasm DATA IDIOMS (CI-checked against the installed f3dasm —\ntrust these over any remembered signature):\n\n    from f3dasm import ExperimentData, ExperimentSample, create_sampler\n    from f3dasm.design import Domain\n    import numpy as np\n\n    # Domain: one add_float per continuous input, one add_output per output.\n    domain = Domain()\n    for name in (\"x1\", \"x2\"):\n        domain.add_float(name, -5.0, 5.0)\n    domain.add_output(\"y\")\n\n    # Space-filling sample: create_sampler() returns a Block; call it ON an\n    # ExperimentData. There is NO data.sample(...) method.\n    data = ExperimentData(domain=domain)\n    sampler = create_sampler(\"latin_sampler\", seed=0)   # or \"random_sampler\"\n    data = sampler.call(data=data, n_samples=8)\n\n    # Read arrays: to_numpy() takes NO argument and returns (X, y) as a tuple.\n    # NOT data.to_numpy(\"input\"). Use X, y = ... (or _, y = ... to discard X).\n    X, y = data.to_numpy()\n    # to_pandas() returns a (input_df, output_df) TUPLE — NOT a single frame.\n    # Unpack it: df_in, df_out = data.to_pandas(). The output_df carries METADATA\n    # columns (_delegation_id, _source, _ts, _wall_ms) alongside the outputs, so\n    # df_out[col].astype(float) FAILS on those. For analysis / surrogate fitting,\n    # always use data.to_numpy() — it strips metadata and returns clean float\n    # arrays. Never use df_out[col].astype(float).\n\n    # Wrap proposed candidate points (e.g. from an acquisition function) into\n    # evaluatable ExperimentData. There is NO ExperimentData.from_numpy; build\n    # ExperimentSamples (kwarg is _input_data, NOT input) then from_data:\n    candidates = np.array([[1.0, 2.0], [3.0, -1.0]])\n    samples = {\n        i: ExperimentSample(\n            _input_data={n: float(candidates[i, j])\n                         for j, n in enumerate(domain.input_names)})\n        for i in range(len(candidates))\n    }\n    cand_data = ExperimentData.from_data(data=samples, domain=domain)\n\n    # COMPOSITION — how f3dasm runs a MULTI-STAGE experiment. Blocks chain with\n    # the >> operator (producing a ChainedBlock) and repeat with .loop(n) (a\n    # LoopBlock). A chain is itself a Block, so it composes further, and kwargs\n    # given to .call() reach every block in the chain.\n    explore = create_sampler(\"latin_sampler\", seed=0)\n    refine = create_sampler(\"random_sampler\", seed=1)\n    chained = explore >> refine                  # ChainedBlock\n    chain_data = chained.call(ExperimentData(domain=domain), n_samples=4)\n    repeated = refine.loop(3)                    # LoopBlock — runs it 3 times\n\n    # Pipeline/Step/Loop is the DECLARATIVE form of the same composition. Step\n    # wraps one Block with its kwargs; Loop repeats a list of Steps.\n    from f3dasm import Loop, Pipeline, Step\n    pipeline = Pipeline(name=\"optimise\", steps=[\n        Step(block=explore, name=\"explore\", kwargs={\"n_samples\": 8}),\n        Loop(n_iterations=3, steps=[Step(block=repeated, name=\"refine\")]),\n    ])\n    # pipeline.run() RETURNS A JOB ID (str), NOT data. Read the result back from\n    # rootdir/job_id. Defaults: mode=\"local\", rootdir=cwd, project_job=<epoch>.\n    #   from pathlib import Path\n    #   job_id = pipeline.run(mode=\"local\", project_job=\"run_001\",\n    #                         rootdir=\"{delegation_id}\")\n    #   result = ExperimentData.from_file(\n    #       project_dir=Path(\"{delegation_id}\") / job_id)\n\n    # Evaluate ground truth ONLY through get_evaluator (ledgered w/ provenance):\n    #   from adda import get_evaluator\n    #   gen = get_evaluator()\n    #   data = gen.call(data, mode=\"sequential\")   # or mode=\"parallel\"\n    #   gen.flush()\n    # After outputs exist, best-N by an output column:\n    #   best = data.get_n_best_output(5, \"y\")   # (n_samples, output_name)\n\n    # sklearn GaussianProcessRegressor: does NOT accept n_jobs (parallelism kwarg).\n    # Correct signature — only these kwargs are valid:\n    #   from sklearn.gaussian_process import GaussianProcessRegressor\n    #   from sklearn.gaussian_process.kernels import Matern\n    #   gpr = GaussianProcessRegressor(\n    #       kernel=Matern(nu=2.5), n_restarts_optimizer=5, alpha=1e-6,\n    #       normalize_y=True, random_state=0,\n    #   )\n    # WRONG: GaussianProcessRegressor(..., n_jobs=4)  → TypeError\n\n    # @datagenerator: return SCALARS, not dicts.\n    # output_names=['y'] already maps name→value; return the value directly.\n    #   CORRECT:   @datagenerator(output_names=['y'])\n    #              def my_oracle(x): return x**2        # scalar\n    #   WRONG:     def my_oracle(x): return {'y': x**2} # stores dict-as-string\n    # Multiple outputs: return a tuple in the same order as output_names.\n    #   @datagenerator(output_names=['y1', 'y2'])\n    #   def f(x): return x, x**2   # positional tuple, NOT a dict\n"}], "done_chain": ["_pending_refusal", "_capture_retrospective", "_milestone_gate", "_first_call_warning", "_must_reproduce"], "switches": [{"key": "citation_weighting", "kind": "config.yaml runtime:", "env": "F3DASM_CITATION_WEIGHTING", "file": "src/adda/_src/runtime/settings.py"}, {"key": "context_policy", "kind": "config.yaml runtime:", "env": "F3DASM_CONT /* On the row header, so a section carrying a proposal says so before you open
   it — with the reason, which is the part that tells you what was edited and
   why. Not a button: the header is one, and a button inside a button is not a
   thing. Opening the row gets you the suggestion toggle. */
function rowFlag(key){
  if(!key) return "";
  const list = forSpan(key);
  if(!list.length) return "";
  const first = list[0];
  const note = (first.note || "").trim();
  const more = list.length > 1 ? ` +${list.length - 1}` : "";
  return `<span class="rowprop" title="${esc(list.map(e =>
      (e.author || "anonymous") + (e.note ? " \u2014 " + e.note : "")).join("\n"))}"
    >\u270e ${esc(first.author || "anon")}${more}${
      note ? ` <i>${esc(note.length > 58 ? note.slice(0,57) + "\u2026" : note)}</i>` : ""}</span>`;
}

function editChip(key, rowKey){
  if(!key) return "";
  const mine = forSpan(key);
  if(!mine.length) return "";
  const shown = SHOWING.has(key);
  const label = mine.length === 1 ? "1 proposal" : `${mine.length} proposals`;
  return `<button class="chip k-open sugg${shown ? " on" : ""}" type="button"
    data-suggest="${esc(key)}" data-row="${esc(rowKey || "")}"
    title="${shown ? "Back to the text as the repository has it"
                   : "Show the proposal on the prompt, struck through and underlined"}"
    >${label} \u00b7 ${shown ? "hide" : "show"}</button>`;
}

/* Paint (or unpaint) one section's prompt with the proposal showing. */
function paintSuggestion(spanKey, rowKey){
  const pre = document.getElementById("txt-" + rowKey);
  const sec = SECTIONS.get(rowKey);
  if(!pre || !sec) return;
  const list = forSpan(spanKey).filter(e => e.kind !== "note");
  const idx = SHOWING.get(spanKey);
  if(idx === undefined || !list.length){
    pre.classList.remove("suggesting");
    pre.innerHTML = promptBody(sec);
  } else {
    const e = list[Math.min(idx, list.length - 1)];
    pre.classList.add("suggesting");
    pre.innerHTML = suggestionHTML(e.base || sec.text, e.proposed || "");
  }
  const bar = document.getElementById("sg-" + rowKey);
  if(bar) bar.innerHTML = suggestionBar(spanKey, rowKey);
  document.querySelectorAll(`[data-editchip="${CSS.escape(spanKey)}"]`).forEach(el => {
    el.innerHTML = editChip(spanKey, el.dataset.row || "");
  });
}

/* Who is suggesting, why, and — when more than one person has — which of them
   you are looking at. */
function suggestionBar(spanKey, rowKey){
  const idx = SHOWING.get(spanKey);
  if(idx === undefined) return "";
  const list = forSpan(spanKey).filter(e => e.kind !== "note");
  if(!list.length) return "";
  const e = list[Math.min(idx, list.length - 1)];
  return `<div class="suggbar">
    <span class="chip k-open">suggestion</span>
    <span class="src">by <b>${esc(e.author || "anonymous")}</b></span>

        i === Math.min(idx, list.length-1) ? " save" : ""}" type="button"

      >${esc(o.author || "anon")}</button>`).join("") : ""}

/* Has the source moved under an edit since it was written? The map is
   regenerated from the repo, so the CURRENT text of that span is right here in
   DATA — an edit whose base no longer matches it is the merge conflict, and
   the staging view shows both sides rather than letting an apply guess. */
const SPAN_TEXT = new Map();
function indexSpans(){
  DATA.roles.forEach(r => r.layers.forEach(l => (l.sections || []).forEach(sec => {
    if(sec.edit && sec.edit.ok) SPAN_TEXT.set(sec.edit.key, sec.text);
  })));
}

function staleness(e){
  if(!SPAN_TEXT.has(e.key)) return {kind:"gone",
    why:"This section is no longer in the map under that span — the prompt was "
        + "moved, renamed, or removed since the edit was written."};
  const now = SPAN_TEXT.get(e.key);
  if(now !== e.base) return {kind:"moved", now,
    why:"The source changed after this edit was written. Applying it blind would "
        + "undo that change, so it needs a merge."};
  return null;
}

/* A line diff, longest-common-subsequence, collapsing long runs of context.
   Small enough to read, which matters more here than being optimal. */
function lineDiff(a, b){
  const A = String(a).split("\n"), B = String(b).split("\n");
  const n = A.length, m = B.length;
  const L = Array.from({length:n+1}, () => new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n && j<m){
    if(A[i]===B[j]){ out.push(["ctx",A[i]]); i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]) out.push(["del",A[i++]]);
    else out.push(["add",B[j++]]);
  }
  while(i<n) out.push(["del",A[i++]]);
  while(j<m) out.push(["add",B[j++]]);
  const keep = out.map(()=>false);
  out.forEach((r,k)=>{ if(r[0]!=="ctx") for(let d=-3;d<=3;d++) if(out[k+d]) keep[k+d]=true; });
  const res=[]; let skipped=0;
  out.forEach((r,k)=>{
    if(keep[k]){ if(skipped){ res.push(["gap",`\u2026 ${skipped} unchanged line${skipped>1?"s":""}`]); skipped=0; } res.push(r); }
    else skipped++;
  });
  if(skipped) res.push(["gap",`\u2026 ${skipped} unchanged line${skipped>1?"s":""}`]);
  return res;
}

/* A word-level diff, for showing a proposal ON the prompt rather than beside
   it. Run only over the stretches the line diff already found changed, so a
   twelve-thousand-character prompt costs a comparison of the sentence someone
   actually touched. */
function wordDiff(a, b){
  const cut = t => t.split(/(\s+)/).filter(x => x !== "");
  const A = cut(a), B = cut(b), n = A.length, m = B.length;
  const L = Array.from({length:n+1}, () => new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const out=[]; let i=0,j=0;
  const push=(k,t)=>{ const last=out[out.length-1];
    if(last && last[0]===k) last[1]+=t; else out.push([k,t]); };
  while(i<n && j<m){
    if(A[i]===B[j]){ push("ctx",A[i]); i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]) push("del",A[i++]);
    else push("add",B[j++]);
  }
  while(i<n) push("del",A[i++]);
  while(j<m) push("add",B[j++]);
  return out;
}

/* The suggestion rendering: the prompt as it stands, with what the proposal
   takes out struck through and what it puts in underlined. The source text is
   never replaced by the proposal — both are on the page at once, which is the
   whole point of a suggestion as against an edit. */
function suggestionHTML(base, proposed){
  const runs = lineDiff(base, proposed);
  const out = [];
  for(let i=0;i<runs.length;i++){
    const [kind, text] = runs[i];
    if(kind === "ctx"){ out.push(esc(text) + "\n"); continue; }
    if(kind === "gap"){ out.push(esc(text) + "\n"); continue; }
    if(kind === "del"){
      // Gather the del-run and any add-run right after it, and compare them
      // word by word — a reworded sentence should read as a reworded
      // sentence, not as one line removed and another added.
      const dels = []; while(runs[i] && runs[i][0]==="del") dels.push(runs[i++][1]);
      const adds = []; while(runs[i] && runs[i][0]==="add") adds.push(runs[i++][1]);
      i--;
      if(!adds.length){ out.push(`<del>${esc(dels.join("\n"))}</del>\n`); continue; }
      out.push(wordDiff(dels.join("\n"), adds.join("\n")).map(([k,t]) =>
        k === "ctx" ? esc(t) : k === "del" ? `<del>${esc(t)}</del>` : `<ins>${esc(t)}</ins>`
      ).join("") + "\n");
      continue;
    }
    out.push(`<ins>${esc(text)}</ins>\n`);
  }
  return out.join("");
}

    b.className="railbtn"; b.type="button"; b.dataset.view=k;
    b.innerHTML=`<span>${label}</span><em>${n}</em>`;
    b.onclick=()=>{ view={kind:k}; query=""; $("#q").value=""; render(); };
    views.appendChild(b);
  });
  /* The committed page carries no generated_at/commit: an embedded commit
     hash can never be correct (the hash of the commit that would contain it
     isn't known until after that commit), and it made every regeneration a
     full-payload diff. Provenance lives in git's history of this file, not
     in its bytes -- so a stamp only shows up on an uncommitted --stamp copy. */
  $("#stamp").textContent = DATA.commit
    ? `${DATA.commit} · ${DATA.generated_at}`
    : "static build · see git log for provenance";
}

function syncRail(){
  document.querySelectorAll(".railbtn").forEach(b=>{
    const on = query ? false
      : (view.kind==="role" ? b.dataset.role===view.id : b.dataset.view===view.kind);
    b.setAttribute("aria-current", on ? "true" : "false");
  });
}

/* ---------------- pieces ---------------- */
function sourceLink(s){
  if(!s) return `<span class="src">unresolved</span>`;
  const exact = s.match==="exact" || s.match==="ast";
  const kind = exact ? "" :
    ` <span class="chip" title="${esc(MATCH_NOTE[s.match]||"")}">${s.span ? "\u2248" : "\u2193"} ${esc(s.match)}${s.partial ? " · partial" : ""}</span>`;
  return `<span class="src" title="${esc(MATCH_NOTE[s.match]||"")}">${esc(srcOf(s))}</span>${kind}`;
}

/* A prompt assembled by .format() is ONE piece of text to the model, so the
   page shows it as one — but the stretches the runtime computes and formats in
   are written in a different file from the template around them, and a map that
   hides that is the map that misattributes them. They are marked in place. */
function promptBody(sec){
  if(!sec.parts) return esc(sec.text);
  return sec.parts.map(p => p.field
    ? `<mark class="sub" title="${esc(p.field)} — built by ${esc(srcOf(p.source))}">${esc(p.text)}</mark>`
    : esc(p.text)).join("");
}

function partLegend(sec){
  const fields = (sec.parts||[]).filter(p=>p.field);
  if(!fields.length) return "";
  return `<div class="legend">${fields.map(p=>`<div class="legrow">
      <code>${esc(p.field)}</code>
      <span class="src">${esc(srcOf(p.source))}</span>
      <span class="chip k-fmt">${p.empty ? "empty for this role" : "built at run time"}</span>
      <p>${esc(p.note)}</p>
    </div>`).join("")}</div>`;
}

const SECTIONS = new Map();   /* row key -> the section object it renders */

/* A .format()-assembled block has no single home, but its WRITTEN stretches do:
   the template's own prose is a verbatim span, and the prose inside a computed
   stanza is a string constant in the module that builds it. Only the values
   formatted in have no source text to edit. Each piece registers as its own
   editor target, so the editor above works on it unchanged. */
function piecesBlock(sec, key){
  const pieces = sec.pieces || [];
  if(!pieces.length) return "";
  return `<div class="pieces" id="pcs-${key}">
    <div class="pieceshead">Editable pieces \u2014 ${pieces.length}</div>
    <p class="secnote">The block above is assembled, so it has no single home — but
      each stretch below is WRITTEN, in one file, and can be changed from here. What
      is missing from this list is the values formatted in: they are supplied per run
      and have no source text to edit.</p>
    ${pieces.map((pc,i) => {
      const pk = key + "-p" + i;
      SECTIONS.set(pk, pc);
      return `<div class="piece">
        <div class="piecetop">
          ${pc.field ? `<code>${esc(pc.field)}</code>` : ""}
          <span class="src">${esc(srcOf(pc.source))}</span>
          <span class="chip k-fmt">${pc.edit.mode === "literal"
            ? "inside a larger literal" : "verbatim span"}</span>
          <button class="editbtn" type="button" data-edit="${pk}">propose an edit</button>
          <span data-editchip="${esc(pc.edit.key)}" data-row="${pk}">${
            editChip(pc.edit.key, pk)}</span>
        </div>
        <div class="suggslot" id="sg-${pk}"></div>
        <div class="editslot" id="ed-${pk}"></div>
        <pre class="prompt piecetext">${esc(pc.text)}</pre>
      </div>`;
    }).join("")}
  </div>`;
}

function sectionRow(sec, key){
  SECTIONS.set(key, sec);
  const preview = sec.text.trim().split("\n")[0].slice(0,90);
  return `<div class="row" data-open="false">
    <button class="rowbtn" type="button" data-toggle="${key}">
      <svg class="chev" width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M2 1l4 3.5L2 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="rowtag">${sec.tag ? `&lt;${esc(sec.tag)}&gt;`
        : sec.label ? esc(sec.label) : `<i>${esc(preview)}</i>`}</span>
      <span data-rowflag="${sec.edit && sec.edit.key ? esc(sec.edit.key) : ""}">${
        sec.edit && sec.edit.key ? rowFlag(sec.edit.key) : ""}</span>
      <span class="rowspacer"></span>
      <span class="rowsrc">${esc(srcOf(sec.source))}</span>
      <span class="rowchars">${num(sec.chars)}</span>
    </button>
    <div class="rowbody" hidden>
      <div class="rowmeta">
        ${sourceLink(sec.source)}
        ${sec.injects ? `<span class="chip k-accent">injected verbatim · ${esc(sec.injects.name)} @ ${esc(sec.injects.file)}:${sec.injects.line}</span>` : ""}
        ${sec.substituted ? `<span class="chip" title="The angle-bracketed paths below stand in for values the runtime formats in per run. They are this map's placeholders, not prompt text — the source writes them as {study_dir} and the like.">paths substituted per run</span>` : ""}
        ${sec.generated ? `<span class="chip k-accent">built at run time, not written here</span>` : ""}
        <button class="copy" type="button" data-copy="${key}">copy text</button>
        ${sec.edit && sec.edit.ok
          ? `<button class="editbtn" type="button" data-edit="${key}">propose an edit</button>` : ""}
        ${(sec.pieces||[]).length
          ? `<a class="chip k-accent" href="#pcs-${key}">${sec.pieces.length} editable pieces \u2193</a>` : ""}
        <span data-editchip="${sec.edit && sec.edit.key ? sec.edit.key : ""}" data-row="${key}">${
          sec.edit && sec.edit.key ? editChip(sec.edit.key, key) : ""}</span>
      </div>
      <div class="suggslot" id="sg-${key}"></div>
      ${sec.edit && !sec.edit.ok
        ? `<p class="noedit"><b>Not editable from this page.</b> ${esc(sec.edit.why)}</p>` : ""}
      <div class="editslot" id="ed-${key}"></div>
      ${piecesBlock(sec, key)}
      ${partLegend(sec)}
      <pre class="prompt" id="txt-${key}">${promptBody(sec)}</pre>
    </div>
  </div>`;
}

/* ---------------- the editor ---------------- */
async function openEditor(key){
  const slot = document.getElementById("ed-"+key);
  const sec = SECTIONS.get(key);
  if(!slot || !sec || !sec.edit || !sec.edit.ok) return;
  if(slot.firstChild){ slot.innerHTML = ""; return; }      // toggle closed
  const id = docId(sec.edit.key, ME);
  const prior = EDITS.get(id);
  const others = forSpan(sec.edit.key).filter(e => e.author_slug !== slug(ME));
  const shared = sec.edit.shared;

  slot.innerHTML = `<div class="editor">
    ${shared ? `<p class="warnshared"><b>Shared text.</b> ${esc(shared.name)} is injected
      verbatim into ${esc(shared.also.join(", "))} as well. An edit here changes what
      ${shared.also.length > 1 ? "those agents see" : "that agent sees"} too.</p>` : ""}
    ${others.length ? `<p class="warnshared"><b>${others.length} other proposal${
      others.length>1?"s":""} on this section</b> \u2014 from ${
      esc(others.map(e=>e.author||"someone").join(", "))}. Yours is kept separately;
      neither overwrites the other, and both are shown side by side in My edits.</p>` : ""}
    <div class="erow">
      <label>this is a
        <select data-kind>
          <option value="proposal"${prior && prior.kind==="proposal" ? " selected":""}>proposed change to the prompt</option>
          <option value="note"${prior && prior.kind==="note" ? " selected":""}>note only \u2014 do not change the code</option>
        </select>
      </label>
      <span class="src">${esc(srcOf(sec.source))}</span>
      ${authorField()}
    </div>
    ${sec.edit.mode === "docstring" ? `<p class="secnote">This is a docstring —
      what the model is told, or what the gate says about itself. Write it as it should
      read; re-indenting it into the source is the applier's job, not yours.</p>` : ""}
    ${sec.edit.mode === "message" ? `<p class="secnote">This is what the gate hands back
      to the agent. It is written inline in the gate's own <code>return</code>, not as a
      named prompt constant, so the applier rewrites that expression. Keep the
      <code>{…}</code> placeholders — they are code, and dropping one drops the number
      or name it formats in.</p>` : ""}
    ${sec.edit.mode === "literal" ? `<p class="secnote">This text is a stretch INSIDE a
      larger string literal (${num(sec.edit.literal_chars)} characters, at
      ${esc(sec.edit.file)}:${sec.edit.line}\u2013${sec.edit.line_end}). It appears there
      exactly once, so your edit replaces exactly this stretch and the applier re-emits the
      literal around it \u2014 nothing else in it changes.</p>` : ""}
    <textarea data-proposed spellcheck="false">${esc(prior && prior.proposed ? prior.proposed : sec.text)}</textarea>
    <input type="text" data-note placeholder="why \u2014 the reason this change is right (optional, but it is what I read first)"
      value="${prior ? esc(prior.note || "") : ""}">
    <div class="erow">
      <button class="editbtn save" type="button" data-save="${key}">save</button>
      <button class="editbtn" type="button" data-cancel="${key}">cancel</button>
      ${prior ? `<button class="editbtn danger" type="button" data-withdraw="${esc(id)}">withdraw mine</button>` : ""}
      <span data-status></span>
    </div>
  </div>`;
  const ta = slot.querySelector("[data-proposed]");
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight+4, 640)+"px"; };
  ta.addEventListener("input", fit); fit(); ta.focus();
  slot.querySelector("[data-kind]").addEventListener("change", e => {
    ta.hidden = e.target.value === "note";
  });
  if((prior && prior.kind) === "note") ta.hidden = true;
}

/* Saving never drops text. A person's own re-save keeps what it replaced in
   `history`, so even the one overwrite the store permits is recoverable. */
const HISTORY_CAP = 6;

async function saveEdit(key){
  const slot = document.getElementById("ed-"+key);
  const sec  = SECTIONS.get(key);
  const kind = slot.querySelector("[data-kind]").value;
  const proposed = slot.querySelector("[data-proposed]").value;
  const note = slot.querySelector("[data-note]").value.trim();
  const status = slot.querySelector("[data-status]");
  const who = setAuthor(slot.querySelector("[data-name]").value);
  if(!who){
    status.textContent = "add your name first \u2014 it is what keeps your edits yours";
    slot.querySelector("[data-name]").focus(); return;
  }
  if(kind === "proposal" && proposed === sec.text && !note){
    status.textContent = "nothing changed"; return;
  }
  if(!DB){ status.textContent = "not saved \u2014 this view cannot write"; return; }
  const id = docId(sec.edit.key, who);
  const prior = EDITS.get(id);
  const history = prior
    ? [{proposed: prior.proposed, note: prior.note, kind: prior.kind,
        saved_at: prior.saved_at}, ...(prior.history || [])].slice(0, HISTORY_CAP)
    : [];
  status.textContent = "saving\u2026";
  try {
    await DB.doc("edits/"+id).set({
      key: sec.edit.key, kind, status: "open",
      author: who, author_slug: slug(who),
      file: sec.edit.file, line: sec.edit.line, line_end: sec.edit.line_end,
      tag: sec.tag || null,
      base: sec.text,                 /* the text this edit was written against */
      proposed: kind === "note" ? "" : proposed,
      note, saved_at: new Date().toISOString(),
      base_commit: DATA.commit || null, history,
    });
    slot.innerHTML = "";
  } catch(err){
    status.textContent = "could not save: " + (err && err.code ? err.code : "error");
  }
}

/* Withdrawing is a STATE, not a delete: the document stays, so a withdrawal
   can be undone and nothing a person wrote leaves the store by accident. */
async function setStatus(id, status){
  if(!DB) return;
  try { await DB.doc("edits/"+id).update({status}); } catch(_) {}
}

/* ---------------- edits view ---------------- */
function renderEdits(){
  if(!DB) return `<h1>My edits</h1>
    <p class="lede">This view cannot reach the artifact's store, so edits cannot be
    saved or read here. Open the artifact from your own Claude account.</p>`;

  const all = [...EDITS.entries()].map(([id, e]) => ({id, ...e}));
  const open = all.filter(e => e.status === "open");
  const applied = all.filter(e => e.status === "applied");
  const gone = all.filter(e => e.status === "withdrawn");

  const groups = new Map();
  open.forEach(e => { if(!groups.has(e.key)) groups.set(e.key, []); groups.get(e.key).push(e); });
  const ordered = [...groups.entries()].sort((a,b) =>
    (a[1][0].file + String(a[1][0].line).padStart(6,"0")).localeCompare(
     b[1][0].file + String(b[1][0].line).padStart(6,"0")));

  const card = (e, withDiff) => {
    const stale = e.status === "open" ? staleness(e) : null;
    return `<div class="editcard${stale ? " stale" : ""}">
    <div class="meta">
      <span class="chip ${e.status==="applied" ? "k-applied" : e.kind==="note" ? "k-note" : "k-open"}">${
        e.status==="applied" ? "applied \u00b7 "+esc(e.applied_commit||"") :
        e.status==="withdrawn" ? "withdrawn" :
        e.kind==="note" ? "note only" : "proposed change"}</span>
      <span class="src"><b>${esc(e.author || "anonymous")}</b></span>
      <span class="src">${esc((e.saved_at||"").slice(0,16).replace("T"," "))}</span>
      ${e.history && e.history.length
        ? `<span class="chip" title="Earlier versions of this person's own edit are kept in the store and are not lost.">${e.history.length} earlier version${e.history.length>1?"s":""} kept</span>` : ""}
      ${e.status==="open" ? `<button class="editbtn danger" type="button" data-withdraw="${esc(e.id)}">withdraw</button>` : ""}
      ${e.status==="withdrawn" ? `<button class="editbtn" type="button" data-restore="${esc(e.id)}">restore</button>` : ""}
    </div>
    ${stale ? `<p class="warnshared"><b>Needs a merge.</b> ${esc(stale.why)}</p>` : ""}
    ${e.note ? `<p class="why">${esc(e.note)}</p>`
             : `<p class="why" style="color:var(--ink-3)">(no reason given)</p>`}
    ${withDiff && e.kind !== "note" ? renderDiff(e.base||"", e.proposed||"") : ""}
    ${stale && stale.kind === "moved"
      ? `<p class="why" style="margin-top:8px"><b>What changed underneath, since this edit:</b></p>
         ${renderDiff(e.base||"", stale.now||"")}` : ""}
  </div>`;
  };

  const group = ([key, list]) => {
    const head = list[0];
    const differ = list.length > 1 &&
      new Set(list.map(e => e.proposed)).size > 1;
    return `<section class="egroup">
      <h3>${head.tag ? "&lt;"+esc(head.tag)+"&gt; " : ""}<span class="src">${
        esc(head.file)}:${head.line}\u2013${head.line_end}</span>
        ${list.length > 1 ? `<span class="chip k-soft">${list.length} people</span>` : ""}</h3>
      ${differ ? `<p class="warnshared"><b>These proposals differ.</b> Both are kept.
        Whoever applies them has to choose, or merge them by hand \u2014 nothing here
        picks a winner.</p>` : ""}
      ${list.map(e => card(e, true)).join("")}
    </section>`;
  };

  return `<p class="eyebrow">Staging</p><h1>My edits</h1>
    <p class="lede">Nothing here has changed the repository. Each entry is a proposal
      parked beside the prompt it belongs to, in this artifact's own store, and it
      survives every republish of the page. Tell the agent that maintains this repo to
      look at the edits and it will apply them to the source, run the suite, and mark
      them applied.</p>
    <p class="lede" style="color:var(--ink-3)">Each person's proposal on a section is
      its own record, so no one overwrites anyone. Re-saving your own keeps the version
      it replaced. Withdrawing sets a state rather than deleting. Names are
      self-declared \u2014 they separate people's work, they do not authenticate it.
      ${authorField()}</p>
    ${ordered.length ? `<h2 class="editsh">Open \u00b7 ${open.length} on ${ordered.length} section${
        ordered.length>1?"s":""}</h2>` + ordered.map(group).join("")
      : `<p class="lede">No open edits. Open a role, expand a section, and choose
         <b>propose an edit</b>.</p>`}
    ${applied.length ? `<h2 class="editsh">Applied \u00b7 ${applied.length}</h2>`
        + applied.map(e => card(e, false)).join("") : ""}
    ${gone.length ? `<h2 class="editsh">Withdrawn \u00b7 ${gone.length}</h2>`
        + gone.map(e => card(e, false)).join("") : ""}`;
}

/* ---------------- role view ---------------- */
function renderRole(r){
  const measured = r.layers.filter(l=>l.chars);
  const total = measured.reduce((a,l)=>a+l.chars,0);

  const bar = measured.map(l=>{
    const pct = l.chars/total*100;
    return `<div class="compseg" style="width:${pct}%;background:${LAYER_COLOR[l.kind]}"
      title="${esc(LAYER_NAME[l.kind])} — ${num(l.chars)} chars">
      <span>${pct>11 ? Math.round(pct)+"%" : ""}</span></div>`;
  }).join("");

  const legend = measured.map(l=>
    `<span><i style="background:${LAYER_COLOR[l.kind]}"></i>${esc(LAYER_NAME[l.kind])}
     <em>${num(l.chars)}</em></span>`).join("");

  const layers = r.layers.map((l,li)=>{
    let body;
    if(l.kind==="catalog" && !l.sections.length){
      body = `<div class="rows"><div class="tools">${
        l.tools.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>`;
    } else {
      body = `<div class="rows">${l.sections.map((s,si)=>sectionRow(s,`${r.id}-${li}-${si}`)).join("")}</div>`;
    }
    return `<section class="layer">
      <div class="layerhead">
        <h2>${esc(l.label)}</h2>
        ${l.chars ? `<span class="chip">${num(l.chars)} chars</span>` : `<span class="chip">run-scoped</span>`}
        ${l.switch ? `<span class="chip k-soft">knob · ${esc(l.switch)}</span>` : ""}
      </div>
      <p class="layernote">${esc(l.note)}
        ${l.definition ? ` <code>${esc(l.definition.file)}:${l.definition.line}</code>` : ""}
        ${l.assembled_at ? ` · assembled at <code>${esc(srcOf(l.assembled_at))}</code>` : ""}</p>
      ${body}
    </section>`;
  }).join("");

  return `<p class="eyebrow">${r.entry ? "Entry node" : "Worker node"}</p>
    <h1>${esc(r.id)}</h1>
    <p class="lede">Everything below is in this agent's context window before it reads a
      single word of its task. Each row cites the file and line it comes from.</p>
    <div class="facts">
      <span><b>class</b> ${esc(r.class)}</span>
      <span><b>defined</b> ${esc(r.module)}</span>
      <span><b>tools</b> ${r.tool_count}</span>
      <span><b>delegates to</b> ${r.delegates_to.length ? esc(r.delegates_to.join(", ")) : "—"}</span>
    </div>
    <div class="comp">
      <div class="compbar">${bar}</div>
      <div class="complegend">${legend}
        <span><i style="background:transparent;border:1px solid var(--line)"></i>total
        <em>${num(total)} chars ≈ ${num(Math.round(total/4))} tokens</em></span>
      </div>
    </div>
    ${layers}`;
}

/* ---------------- gates ---------------- */
/* What the gate SAYS. A nudge or a refusal lands in the agent's context and
   steers what it does next, so it is prompt — and it is the part of a gate a
   reader most needs and, until now, could not see. Each is registered like any
   other editable section, so the same editor and the same staging apply. */
function gateMessages(g){
  if(!g.messages || !g.messages.length) return `<p class="nomsg">This gate returns no
    text of its own \u2014 what the agent experiences comes from the caller, or the gate
    only changes what happens next.</p>`;
  return `<div class="msgs">
    <p class="msghead">What the agent is told \u00b7 ${g.messages.length} message${
      g.messages.length>1?"s":""}</p>
    ${g.messages.map((m,i)=>{
      const key = "gatemsg-" + g.id + "-" + i;
      SECTIONS.set(key, {text: m.text, tag: null, source: {
        file: m.file, line: m.line, line_end: m.line_end, match: "message", span: true},
        edit: m.edit});
      return `<div class="msg">
        <pre class="prompt" id="txt-${key}">${esc(m.text)}</pre>
        <div class="gatefoot">
          <span class="src">${esc(m.file)}:${m.line}\u2013${m.line_end}</span>
          <button class="editbtn" type="button" data-edit="${key}">edit this message</button>
          <span data-editchip="${esc(m.edit.key)}" data-row="${key}">${editChip(m.edit.key, key)}</span>
        </div>
        <div class="suggslot" id="sg-${key}"></div>
        <div class="editslot" id="ed-${key}"></div>
      </div>`;}).join("")}
  </div>`;
}

function gateCard(g, n){
  /* Gates reuse the section editor: SECTIONS is what the editor reads, so a
     gate registers there as the piece of text it actually owns — its
     docstring. Its EFFECT line is this map's summary and its behaviour is its
     code; neither is editable from a page, and the card says which is which. */
  const key = "gate-" + g.id;
  SECTIONS.set(key, {text: g.doc || "", tag: null, source: {
    file: g.file, line: g.edit && g.edit.ok ? g.edit.line : g.line,
    line_end: g.edit && g.edit.ok ? g.edit.line_end : undefined,
    match: g.edit && g.edit.ok ? "docstring" : "symbol",
    span: !!(g.edit && g.edit.ok)}, edit: g.edit});
  return `<article class="gate" data-kind="${esc(g.kind)}">
    <div class="gatenum">${n ?? "·"}</div>
    <div class="gatebody">
      <div class="gatetop">
        <h3>${esc(g.title)}</h3>
        <span class="chip k-${esc(g.kind)}">${esc(g.kind)}</span>
        <span class="chip">${esc(g.phase)}</span>
        ${g.switch ? `<span class="chip k-soft">off via ${esc(g.switch)}</span>` : ""}
        ${g.escape ? `<span class="chip">escape · ${esc(g.escape)}</span>` : ""}
      </div>
      <p class="gateeffect" title="This map's one-line summary of what the agent experiences. It is written in internal/tools/promptmap.py, not in the repository's prompt or gate code.">${esc(g.effect)}</p>
      ${g.doc ? `<p class="gatedoc" title="The gate's own docstring — what it says about itself, in the source.">${esc(g.doc)}</p>` : ""}
      ${gateMessages(g)}
      <div class="gatefoot">
        <span class="src">${esc(g.file)}:${g.line}</span>
        <span class="chip">${esc(g.symbol)}</span>
        ${g.policy ? `<span class="chip">policy · ${esc(g.policy[0])}::${esc(g.policy[1])}</span>` : ""}
        ${g.edit && g.edit.ok
          ? `<button class="editbtn" type="button" data-edit="${key}">edit this description</button>` : ""}
        <span data-editchip="${g.edit && g.edit.key ? g.edit.key : ""}" data-row="${key}">${
          g.edit && g.edit.key ? editChip(g.edit.key, key) : ""}</span>
      </div>
      <div class="editslot" id="ed-${key}"></div>
    </div>
  </article>`;
}

function renderGates(){
  const chain = DATA.gates.filter(g=>g.done_order).sort((a,b)=>a.done_order-b.done_order);
  const rest  = DATA.gates.filter(g=>!g.done_order);
  const byPhase = {};
  rest.forEach(g=>(byPhase[g.phase] ||= []).push(g));

  const counts = ["hard","soft","procedural","advisory"].map(k=>{
    const n = DATA.gates.filter(g=>g.kind===k).length;
    return `<span class="chip k-${k}">${n} ${k}</span>`;
  }).join(" ");

  return `<p class="eyebrow">Machinery</p>
    <h1>What can stop the run</h1>
    <p class="lede">Every checkpoint between an agent's intention and its effect, with the
      symbol that implements it. A <em>hard</em> gate refuses; a <em>soft</em> one speaks and
      lets the agent proceed.</p>
    <p class="lede" style="color:var(--ink-3)">A gate's description is editable here; a gate's
      <b>behaviour</b> is not. What each one does is its code, and the italic line under the
      title is this map's own summary rather than text from the repository. Proposing a better
      description changes what a reader is told, never what a run does — if the description and
      the code disagree, that is worth saying in the reason, and worth a code change.</p>
    <div class="facts" style="gap:6px">${counts}</div>

    <div class="sectionhead"><h2>The Done() sequence</h2>
      <p>Parsed from the literal tuple in <code>feedback.py</code> — this is the source's own order,
         not a reconstruction. A gate that holds returns immediately; nothing after it runs.</p></div>
    <div class="chain">${chain.map(g=>gateCard(g,g.done_order)).join("")}</div>

    ${Object.entries(byPhase).map(([phase,gs])=>`
      <div class="sectionhead"><h2>${esc(phase)}</h2>
        <p>${gs.length} checkpoint${gs.length>1?"s":""}, unordered — each fires on its own trigger.</p></div>
      <div class="chain">${gs.map(g=>gateCard(g,null)).join("")}</div>`).join("")}`;
}

/* ---------------- config ---------------- */
function renderConfig(){
  return `<p class="eyebrow">Machinery</p>
    <h1>Config knobs</h1>
    <p class="lede">Everything a reviewer can change without editing code. Resolution order is
      environment variable, then the study's <code>config.yaml</code> <code>runtime:</code> block,
      then the default — and an unrecognised key is reported rather than silently ignored.</p>
    <div class="sectionhead"><h2>${DATA.switches.length} knobs</h2>
      <p>Read from <code>runtime/settings.py</code> and from the environment reads found in source.</p></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Key</th><th>Set via</th><th>Environment override</th><th>Read at</th></tr></thead>
      <tbody>${DATA.switches.map(s=>`<tr>
        <td class="m">${esc(s.key)}</td>
        <td>${esc(s.kind)}</td>
        <td class="m">${esc(s.env)}</td>
        <td class="m path">${esc((s.sites||[s.file]).join("  "))}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;
}

/* ---------------- shared blocks ---------------- */
function renderShared(){
  return `<p class="eyebrow">Machinery</p>
    <h1>Shared blocks</h1>
    <p class="lede">Text defined once and injected verbatim into more than one role, so two agents
      can cite the same clause number at each other without paraphrase drift.</p>
    ${DATA.shared.map((b,i)=>{
      const used = DATA.roles.filter(r=>r.layers.some(l=>
        l.sections.some(s=>s.injects && s.injects.name===b.name))).map(r=>r.id);
      return `<section class="layer">
        <div class="layerhead"><h2>${esc(b.name)}</h2>
          <span class="chip">${num(b.chars)} chars</span>
          <span class="chip k-accent">in ${esc(used.join(", ")||"—")}</span></div>
        <p class="layernote">Defined at <code>${esc(b.file)}:${b.line}</code></p>
        <div class="rows">${sectionRow({tag:b.name,text:b.text,chars:b.chars,
          source:{file:b.file,line:b.line,match:"exact"}}, `shared-${i}`)}</div>
      </section>`;
    }).join("")}`;
}

/* ---------------- search ---------------- */
function renderSearch(q){
  const needle = q.toLowerCase();
  const hits = [];
  DATA.roles.forEach(r=>r.layers.forEach(l=>l.sections.forEach(s=>{
    const i = s.text.toLowerCase().indexOf(needle);
    if(i<0) return;
    hits.push({where:`${r.id} › ${s.tag ? "<"+s.tag+">" : l.label}`,
               src:srcOf(s.source), text:s.text, i,
               n:s.text.toLowerCase().split(needle).length-1});
  })));
  DATA.gates.forEach(g=>{
    const hay = (g.title+" "+g.effect+" "+g.doc+" "+g.symbol).toLowerCase();
    const i = hay.indexOf(needle);
    if(i>=0) hits.push({where:`gate › ${g.title}`, src:`${g.file}:${g.line}`,
                        text:g.effect+"\n"+g.doc, i:Math.max(0,(g.effect+"\n"+g.doc).toLowerCase().indexOf(needle)), n:1});
  });
  hits.sort((a,b)=>b.n-a.n);

  const body = hits.length ? hits.map(h=>{
    const from = Math.max(0, h.i-180), to = Math.min(h.text.length, h.i+needle.length+280);
    const raw = (from?"…":"") + h.text.slice(from,to) + (to<h.text.length?"…":"");
    const re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    const marked = esc(raw).replace(re, m=>`<mark>${m}</mark>`);
    return `<div class="hit">
      <div class="hittop"><b>${esc(h.where)}</b>
        <span class="src">${esc(h.src)}</span>
        <span class="chip">${h.n} match${h.n>1?"es":""}</span></div>
      <p class="hitex">${marked}</p></div>`;
  }).join("") : `<p class="empty">No prompt text or gate mentions “${esc(q)}”.</p>`;

  return `<p class="eyebrow">Search</p>
    <h1>“${esc(q)}”</h1>
    <p class="lede">${hits.length} place${hits.length===1?"":"s"} in the assembled prompts and gate
      definitions. Every result carries the file and line to open.</p>
    <div class="sectionhead"><h2>Results</h2><p>Ordered by number of matches in the block.</p></div>
    ${body}`;
}

/* ---------------- render ---------------- */
function render(){
  const main = $("#main");
  if(query.trim().length>=2){ main.innerHTML = renderSearch(query.trim()); }
  else if(view.kind==="role"){ main.innerHTML = renderRole(DATA.roles.find(r=>r.id===view.id)); }
  else if(view.kind==="gates"){ main.innerHTML = renderGates(); }
  else if(view.kind==="config"){ main.innerHTML = renderConfig(); }
  else if(view.kind==="edits"){ main.innerHTML = renderEdits(); }
  else { main.innerHTML = renderShared(); }
  syncRail();
  main.scrollTop = 0;
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]");
  if(t){
    const row = t.closest(".row");
    const open = row.dataset.open === "true";
    row.dataset.open = open ? "false" : "true";
    row.querySelector(".rowbody").hidden = open;
    return;
  }
  const sg = e.target.closest("[data-suggest]");
  if(sg){
    const span = sg.dataset.suggest, row = sg.dataset.row;
    if(sg.dataset.idx !== undefined) SHOWING.set(span, Number(sg.dataset.idx));
    else if(SHOWING.has(span)) SHOWING.delete(span);
    else SHOWING.set(span, 0);
    paintSuggestion(span, row);
    return;
  }
  const ed = e.target.closest("[data-edit]");
  if(ed){ openEditor(ed.dataset.edit); return; }
  const sv = e.target.closest("[data-save]");
  if(sv){ saveEdit(sv.dataset.save); return; }
  const cx = e.target.closest("[data-cancel]");
  if(cx){ document.getElementById("ed-"+cx.dataset.cancel).innerHTML = ""; return; }
  const wd = e.target.closest("[data-withdraw]");
  if(wd){ setStatus(wd.dataset.withdraw, "withdrawn");
          const slot = wd.closest(".editslot"); if(slot) slot.innerHTML = ""; return; }
  const rs = e.target.closest("[data-restore]");
  if(rs){ setStatus(rs.dataset.restore, "open"); return; }

  const c = e.target.closest("[data-copy]");
  if(c){
    const txt = document.getElementById("txt-"+c.dataset.copy).textContent;
    navigator.clipboard?.writeText(txt).then(()=>{
      c.textContent = "copied"; setTimeout(()=>c.textContent="copy text", 1400);
    });
  }
});

document.addEventListener("change", e=>{
  if(e.target.matches("[data-name]")) setAuthor(e.target.value);
});

$("#q").addEventListener("input", e=>{ query = e.target.value; render(); });
/* ---------- the side panel, hidden or shown ----------
   Remembered per viewer in localStorage: it is a reading preference, not
   shared state, and every access is guarded because a private window or
   blocked site data makes the accessor throw rather than return null. */
const RAIL_KEY = "promptmap.rail";
const shell = document.querySelector(".shell");
const railBtn = $("#railtoggle");

function setRail(on){
  shell.dataset.rail = on ? "on" : "off";
  railBtn.setAttribute("aria-expanded", on ? "true" : "false");
  const label = on ? "Hide the side panel" : "Show the side panel";
  railBtn.setAttribute("aria-label", label);
  railBtn.title = label + "  (\\)";
  try { localStorage.setItem(RAIL_KEY, on ? "on" : "off"); } catch(_) {}
}

let railOpen = true;
try { railOpen = localStorage.getItem(RAIL_KEY) !== "off"; } catch(_) { railOpen = true; }
setRail(railOpen);
railBtn.addEventListener("click", () => setRail(shell.dataset.rail === "off"));

document.addEventListener("keydown", e=>{
  if(e.key==="/" && e.target.tagName!=="INPUT"){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape" && e.target.id==="q"){ e.target.value=""; query=""; render(); }
  if(e.key==="\\" && e.target.tagName!=="INPUT" && e.target.tagName!=="TEXTAREA"){
    e.preventDefault(); setRail(shell.dataset.rail === "off");
  }
});

indexSpans();
buildRail();
render();
/* The page is complete and readable before this resolves; editing lights up
   when — and only when — the viewer's runtime grants the store. */
initEdits();
</script>
