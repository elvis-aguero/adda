repos:
  - repo: local
    hooks:
      # The paper is a living design register, so the moment a design
      # decision lands in the code is the only moment anyone is looking at
      # both. This does NOT check that paper/ is correct -- nothing can --
      # it shows what changed and makes ignoring it deliberate.
      #
      # pass_filenames: false and always_run because the question is about
      # the STAGED SET as a whole, not any one file. The script itself
      # no-ops when nothing staged touches the watched paths, which is also
      # what makes `pre-commit run --all-files` in CI a no-op.
      - id: paper_attestation
        name: paper attested against these changes
        entry: python internal/tools/paper_attestation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: sort_pyproject
        name: sort_pyproject
        entry: toml-sort -i --sort-table-keys --sort-inline-tables
        language: python
        files: ^pyproject\.toml$
        additional_dependencies: ["toml-sort==0.23.1"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10  # aligned with the ruff>=0.14.10 floor in pyproject
    hooks:
      # Lint-only: check (and apply safe fixes), never auto-reformat.
      - id: ruff-check
        types_or: [python, pyi, jupyter, toml]
        args: [--fix]
